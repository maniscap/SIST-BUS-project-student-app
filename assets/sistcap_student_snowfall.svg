<svg fill="none" viewBox="0 0 900 220" width="100%" height="220" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020d18" />
      <stop offset="50%" stop-color="#0b1e36" />
      <stop offset="100%" stop-color="#020d18" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#a78bfa" />
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="900" height="220" rx="16" fill="url(#bgGrad)" stroke="#1e3a8a" stroke-width="1.5"/>

  <!-- Radar Grid -->
  <path d="M0 60 H900 M0 110 H900 M0 160 H900" stroke="#38bdf8" stroke-opacity="0.08" stroke-dasharray="6 6"/>
  <path d="M150 0 V220 M300 0 V220 M450 0 V220 M600 0 V220 M750 0 V220" stroke="#818cf8" stroke-opacity="0.06" stroke-dasharray="6 6"/>

  <!-- Animated Snowflakes -->
  <g fill="#e0f2fe" opacity="0.85">
    <text font-size="16" y="0">❄<animate attributeName="x" values="75;90;75" dur="4.2s" repeatCount="indefinite" /><animate attributeName="y" values="-10;230" dur="5.2s" repeatCount="indefinite" /><animate attributeName="opacity" values="0;0.9;0" dur="5.2s" repeatCount="indefinite" /></text>
    <text font-size="20" y="0">❄<animate attributeName="x" values="215;195;215" dur="6.1s" repeatCount="indefinite" /><animate attributeName="y" values="-10;230" dur="7.1s" repeatCount="indefinite" /><animate attributeName="opacity" values="0;1;0" dur="7.1s" repeatCount="indefinite" /></text>
    <text font-size="14" y="0">❅<animate attributeName="x" values="365;385;365" dur="5.1s" repeatCount="indefinite" /><animate attributeName="y" values="-10;230" dur="6.1s" repeatCount="indefinite" /><animate attributeName="opacity" values="0;0.8;0" dur="6.1s" repeatCount="indefinite" /></text>
    <text font-size="22" y="0">❄<animate attributeName="x" values="515;500;515" dur="7.2s" repeatCount="indefinite" /><animate attributeName="y" values="-10;230" dur="8.2s" repeatCount="indefinite" /><animate attributeName="opacity" values="0;1;0" dur="8.2s" repeatCount="indefinite" /></text>
    <text font-size="15" y="0">❅<animate attributeName="x" values="675;695;675" dur="5.6s" repeatCount="indefinite" /><animate attributeName="y" values="-10;230" dur="6.6s" repeatCount="indefinite" /><animate attributeName="opacity" values="0;0.85;0" dur="6.6s" repeatCount="indefinite" /></text>
    <text font-size="18" y="0">❄<animate attributeName="x" values="805;785;805" dur="6.3s" repeatCount="indefinite" /><animate attributeName="y" values="-10;230" dur="7.3s" repeatCount="indefinite" /><animate attributeName="opacity" values="0;0.9;0" dur="7.3s" repeatCount="indefinite" /></text>
  </g>

  <g text-anchor="middle">
    <text x="450" y="95" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="900" fill="url(#textGrad)" letter-spacing="1.5" filter="url(#neonGlow)">
      📱 SISTCAP STUDENT BUS APP
    </text>
    <text x="450" y="138" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="500" fill="#94a3b8">
      Live GPS Bus Radar • QR Boarding Pass Scanner • Offline Tile Caching
    </text>
    <rect x="290" y="165" width="320" height="28" rx="14" fill="#1e3a8a" stroke="#60a5fa" stroke-width="1"/>
    <text x="450" y="184" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#60a5fa">
      📱 FLUTTER 3.X • CROSS-PLATFORM RADAR
    </text>
  </g>
</svg>